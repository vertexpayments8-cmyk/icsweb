<!doctype html>
<html><head><meta charset="utf-8"><title>Standard sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#1C1C1E}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 80px;border-bottom:1px solid #e5e5e5}
.logo{display:flex;align-items:center;gap:12px}
.ics{font-family:Impact,sans-serif;font-size:46px;color:#B5121B;line-height:.85}
.rule{width:2px;height:44px;background:#B5121B}
.words{font-weight:700;font-size:14px;line-height:1.08}
nav{display:flex;gap:36px;font-size:16px;align-items:center}
nav .cta{background:#B5121B;color:#fff;padding:12px 22px;border-radius:6px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:80px}
h1{font-size:64px;line-height:1.05;font-weight:800}
.hero p{font-size:21px;line-height:1.5;margin-top:24px;color:#555}
.btns{display:flex;gap:16px;margin-top:36px}
.b1{background:#B5121B;color:#fff;padding:18px 30px;border-radius:6px;font-weight:700}
.b2{border:2px solid #1C1C1E;padding:16px 28px;border-radius:6px;font-weight:700}
.photo{background:#E9E7E3;border-radius:12px;height:440px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 80px}
.card{background:#F3F3F1;border-radius:10px;height:160px;padding:24px;font-weight:700;font-size:20px}
</style></head><body>
<header><div class="logo"><div class="ics">ICS</div><div class="rule"></div><div class="words">Integrated<br>Care<br>Solutions</div></div>
<nav><span>Services</span><span>About</span><span>Contact</span><span class="cta">Call now</span></nav></header>
<section class="hero"><div><h1>Reliable back-office services for growing businesses</h1>
<p>Data entry, accounting and backend processing handled by a dedicated team in Delhi.</p>
<div class="btns"><span class="b1">Call +91 98115 51563</span><span class="b2">View services</span></div></div>
<div class="photo"></div></section>
<div class="cards"><div class="card">Data entry</div><div class="card">Accounting</div><div class="card">Backend process</div></div>
</body></html>
